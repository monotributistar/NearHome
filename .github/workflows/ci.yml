name: NearHome CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint + TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/api db:reset
      - run: pnpm --filter @app/api test
      - run: pnpm --filter @app/stream-gateway test

  test-e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Start stack
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait
          sleep 10
          curl -f http://localhost:3001/health
          curl -f http://localhost:3010/health

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Portal smoke
        run: pnpm test:e2e:portal:seeded
        env:
          API_URL: http://localhost:3001
          PORTAL_URL: http://localhost:5174

      - name: Run Admin smoke
        run: pnpm test:e2e:admin:seeded
        env:
          API_URL: http://localhost:3001
          ADMIN_URL: http://localhost:5173

      - name: Run camera isolation
        run: pnpm test:e2e:cameras-isolation
        env:
          API_URL: http://localhost:3001
          PORTAL_URL: http://localhost:5174

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=100

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose -f infra/docker-compose.yml build --parallel
