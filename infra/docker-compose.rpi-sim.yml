# Simulador de RPi Edge Gateway
# Crea un tenant aislado con:
#   - Red propia 10.99.1.0/24
#   - Cámara RTSP simulada (MediaMTX con video de prueba)
#   - WireGuard client conectado al Home Hub
#   - Discovery-agent mock

name: nearhome-rpi-sim

services:
  # ─── Cámara RTSP simulada ─────────────────────────────────────────
  # Corre en la red aislada del "tenant"
  camara-rtsp:
    image: aler9/rtsp-simple-server:latest
    networks:
      rpi_net:
        ipv4_address: 10.99.1.10
    volumes:
      - rtsp-config:/rtsp-simple-server.yml
    environment:
      RTSP_ADDRESS: ":554"
      HLS: "no"

  # ─── Generador de video de prueba ──────────────────────────────────
  # Publica un video de prueba en la cámara RTSP simulada
  generador-video:
    image: linuxserver/ffmpeg:latest
    networks:
      rpi_net:
        ipv4_address: 10.99.1.11
    entrypoint: >
      sh -c "
      apt-get update -qq && apt-get install -y -qq wget >/dev/null 2>&1;
      wget -q -O /tmp/test.mp4 https://github.com/ultralytics/assets/releases/download/v0.0.0/bus.mp4 2>/dev/null ||
        ffmpeg -f lavfi -i testsrc2=size=640x480:rate=10:duration=300 -f lavfi -i anullsrc -c:v libx264 -preset ultrafast -t 300 /tmp/test.mp4;
      ffmpeg -stream_loop -1 -re -i /tmp/test.mp4 -c copy -f rtsp rtsp://10.99.1.10:554/test
      "
    depends_on:
      - camara-rtsp
    restart: unless-stopped

  # ─── RPi Simulado (WireGuard + discovery-agent) ───────────────────
  rpi-sim:
    build:
      context: ../
      dockerfile: apps/rpi-sim/Dockerfile
    image: nearhome/rpi-sim:latest
    networks:
      rpi_net:
        ipv4_address: 10.99.1.1
      hub_net:
        ipv4_address: 172.20.0.2
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - /lib/modules:/lib/modules:ro
    environment:
      TENANT_ID: tenant-simulado
      RPI_ID: rpi-sim-1

      # Red local del tenant (simulada)
      LOCAL_SUBNET: 10.99.1.0/24
      LOCAL_RTSP_CAMERAS: '["rtsp://10.99.1.10:554/test"]'

      # WireGuard peer hacia el Home Hub
      WG_HUB_PUBLIC_KEY: b0mbzJb2cv34PvcT/tB5M7GrkUNNI96u4pF9uDr9QiE=
      WG_HUB_ENDPOINT: 192.168.0.156:51820

      # API del Home Hub (via Headscale o LAN)
      API_BASE_URL: http://192.168.0.115:3001

      # Tailscale/Headscale login (para control)
      HEADSACLE_URL: http://100.64.0.1:8081
      HEADSACLE_AUTH_KEY: ""

networks:
  rpi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.1.0/24
          gateway: 10.99.1.1

  hub_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
