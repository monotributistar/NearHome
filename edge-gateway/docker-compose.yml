version: "2"

services:
  discovery-agent:
    build:
      context: ./discovery-agent
      dockerfile: Dockerfile
    restart: always
    network_mode: host
    privileged: true
    volumes:
      - ./discovery-agent/config.yaml:/app/config.yaml:ro
    environment:
      - BALENA_DEVICE_UUID=${BALENA_DEVICE_UUID:-}
      - EDGE_GATEWAY_API_TOKEN=${EDGE_GATEWAY_API_TOKEN:-}
      - API_BASE_URL=${API_BASE_URL:-http://api:3001}
      - WIFI_SSID=${WIFI_SSID:-}
      - WIFI_PASSWORD=${WIFI_PASSWORD:-}
      - WIFI_SECURITY=${WIFI_SECURITY:-wpa2}
    labels:
      io.balena.supervised: "true"

  # Optional: tunnel manager as separate service
  # tunnel-manager:
  #   build: ./discovery-agent
  #   command: python -u src/tunnel_manager.py
  #   restart: always
  #   network_mode: host
  #   volumes:
  #     - ./discovery-agent/config.yaml:/app/config.yaml:ro
  #   environment:
  #     - BALENA_DEVICE_UUID=${BALENA_DEVICE_UUID:-}
  #   labels:
  #     io.balena.supervised: "true"
