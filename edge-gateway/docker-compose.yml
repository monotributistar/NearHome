version: "2"

services:
  discovery-agent:
    build:
      context: ./discovery-agent
      dockerfile: Dockerfile
    restart: always
    network_mode: host
    privileged: true
    volumes:
      - ./discovery-agent/config.yaml:/app/config.yaml:ro
    environment:
      - BALENA_DEVICE_UUID=${BALENA_DEVICE_UUID:-}
      - EDGE_GATEWAY_API_TOKEN=${EDGE_GATEWAY_API_TOKEN:-}
      - API_BASE_URL=${API_BASE_URL:-http://api:3001}
      - WIFI_SSID=${WIFI_SSID:-}
      - WIFI_PASSWORD=${WIFI_PASSWORD:-}
      - WIFI_SECURITY=${WIFI_SECURITY:-wpa2}
    labels:
      io.balena.supervised: "true"

  wireguard-router:
    build:
      context: ./wireguard-router
      dockerfile: Dockerfile
    restart: always
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./wireguard-router/wg0.conf.example:/etc/wireguard/wg0.conf:ro
    environment:
      - WG_INTERFACE=${WG_INTERFACE:-wg0}
      - WG_CONFIG_PATH=${WG_CONFIG_PATH:-/etc/wireguard/wg0.conf}
      - CAMERA_SUBNET_CIDR=${CAMERA_SUBNET_CIDR:-192.168.10.0/24}
      - INFRA_ALLOWED_CIDRS=${INFRA_ALLOWED_CIDRS:-10.88.0.0/16}
      - CAMERA_IFACE=${CAMERA_IFACE:-eth0}
      - ROUTING_MODE=${ROUTING_MODE:-route}
    labels:
      io.balena.supervised: "true"

  # Optional: tunnel manager as separate service
  # tunnel-manager:
  #   build: ./discovery-agent
  #   command: python -u src/tunnel_manager.py
  #   restart: always
  #   network_mode: host
